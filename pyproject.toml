[project]
name = "seamulator"
version = "0.1.0"
description = "Macro-scale maritime traffic simulator with visualization"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Maritime Simulator Team" }]

dependencies = [
    "dash>=2.14.0",
    "plotly>=5.18.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ruff>=0.16.7",
    "searoute>=1.6.0",
    "networkx>=3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "notebook>=7.6.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]


[project.scripts]
seamulator = "seamulator.visualization.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seamulator"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]

